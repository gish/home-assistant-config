- alias: Turn on common lights 
  trigger:
    platform: state
    entity_id: input_boolean.common_lights
    to: 'on'
  action:
    - service: scene.turn_on
      entity_id: scene.common_lights_on
    - service: light.turn_on
      target: 
        entity_id: light.extended_color_light_21
      data:
        brightness_pct: 23
        rgb_color:
          - 255
          - 138
          - 17

- alias: Turn off common lights 
  trigger:
    platform: state
    entity_id: input_boolean.common_lights
    to: 'off'
  action:
    - service: scene.turn_on
      entity_id: scene.common_lights_off
    - service: light.turn_off
      target: 
        entity_id: light.extended_color_light_21
        
